<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyPirates テスト版</title>
<style>
:root{
  --bg:#eef3f9; --panel:#ffffff; --ink:#1b2430; --sub:#5b6878; --line:#d5dde8;
  --accent:#2f6fd6; --accent-ink:#fff; --warn:#c2410c; --ok:#15803d;
  --cell:#e7f0e3; --cell-enemy:#f6dcdc; --hi:#fde68a; --king:#b45309;
  --mine:#8b6f4e; --lab:#3b82b0; --shrine:#a0529b; --base:#475569; --wh:#6b7f3a; --mk:#b7791f; --lm:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620; --panel:#18212d; --ink:#e6edf5; --sub:#98a6b8; --line:#2b3746;
    --accent:#5b93ee; --accent-ink:#0b1220; --warn:#fb923c; --ok:#4ade80;
    --cell:#1f3326; --cell-enemy:#3a2226; --hi:#6b5b17; --king:#f59e0b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
body{padding:12px 16px 80px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:8px 0 4px}
h2{font-size:16px;margin:16px 0 8px}
.sub{color:var(--sub);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.on{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px}
.stat b{font-size:15px}
.board{display:grid;grid-template-columns:22px repeat(8,1fr);gap:3px;width:100%;max-width:440px;margin:8px auto}
.board .lab{font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.cell{aspect-ratio:1;border-radius:6px;background:var(--cell);border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;padding:0;min-height:0}
.cell[data-ro]{cursor:default}
.cell.enemy{background:var(--cell-enemy)}
.cell.target{box-shadow:inset 0 0 0 3px var(--accent);background:var(--hi)}
.cell .b{position:absolute;inset:3px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05;text-align:center}
.cell .b small{font-size:9px;font-weight:600;opacity:.9}
.cell .b.closed{background:var(--panel)!important;color:var(--ink);border:2px dashed var(--sub)}
.cell .k{position:absolute;right:1px;top:-2px;font-size:14px}
.b.mine{background:var(--mine)}.b.lab{background:var(--lab)}.b.shrine{background:var(--shrine)}
.b.base{background:var(--base)}.b.warehouse{background:var(--wh)}.b.market{background:var(--mk)}.b.landmark{background:var(--lm)}
.cloud{aspect-ratio:1;max-width:440px;margin:8px auto;border-radius:12px;background:repeating-linear-gradient(45deg,var(--line),var(--line) 10px,var(--bg) 10px,var(--bg) 20px);display:flex;align-items:center;justify-content:center;color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:13px}
.result-t{min-width:600px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
td.n,th.n{text-align:right}
.menu button{width:100%;text-align:left;margin:3px 0;display:flex;justify-content:space-between;gap:8px}
.menu button span.c{color:var(--sub);font-size:12px}
.log{max-height:180px;overflow:auto;font-size:12px;color:var(--sub)}
/* タイトル画面：イラストを全面の背景にして、その上にパネルを重ねる */
.tbg{display:none}
body.titlebg .tbg{display:block;position:fixed;inset:0;z-index:-1;background:#2c5a8c}
body.titlebg .tbg img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
body.titlebg .tbg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(6,12,22,.15),rgba(6,12,22,.35) 40%,rgba(6,12,22,.6))}
body.titlebg #app{position:relative;z-index:1}
body.titlebg .ttl{color:#fff;padding:min(22vh,180px) 0 8px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
body.titlebg .ttl h1{margin:0;font-size:clamp(32px,8vw,56px);letter-spacing:.05em}
body.titlebg .ttl .ver{font-size:12px;opacity:.9}
body.titlebg .panel{background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
body.titlebg.noimg .tbg{display:none}
body.titlebg.noimg .ttl{color:var(--ink);padding-top:8px;text-shadow:none}
.ttl{display:none}body.titlebg .ttl{display:block}
.timerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
#timerbadge{font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
#timerbadge.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:90vw;z-index:10;font-size:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.hint{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:92vw;width:420px}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0;font-size:12px}
.steps .st{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.steps .st small{font-size:10px}
.steps .st.done{color:var(--ok);border-color:var(--ok)}
.steps .st.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.steps .st.skip{opacity:.5}
.steps .arr{color:var(--sub)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;width:100%;margin-top:6px}
.acts button{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.acts button small{font-size:11px;color:var(--sub);font-weight:400}
.genbox{border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;width:100%}
.cost{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.cost.can,button.can{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.costlist{max-height:62vh;overflow:auto}
dialog{max-height:90vh}
.cell .fl{position:absolute;left:1px;bottom:1px;font-size:9px;line-height:1;border-radius:3px;padding:1px}
.cell .dm{position:absolute;left:1px;top:1px;font-size:9px;background:var(--warn);color:#fff;border-radius:3px;padding:0 2px;line-height:1.3}
.cell .rb{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:8px;line-height:1.2;font-weight:600;color:var(--ink);opacity:.45;pointer-events:none}
.cell .mk{position:absolute;right:1px;bottom:1px;font-size:10px;background:var(--ink);color:var(--bg);border-radius:3px;padding:0 2px;line-height:1.3}
.cell .k small{font-size:9px;color:var(--warn);font-weight:700}
.cell.inrange{outline:3px solid #f59e0b;outline-offset:-3px}
.b.ruin{background:repeating-linear-gradient(45deg,#6b7280,#6b7280 4px,#9ca3af 4px,#9ca3af 8px)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);justify-content:center;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
button.mini{min-height:30px;padding:3px 8px;font-size:12px}
.baserow{margin:4px 0}
.rec td,.rec th{white-space:nowrap}
.rec td.seq{white-space:normal;word-break:break-all;min-width:9em;max-width:12em;font-size:11px;letter-spacing:1px}
.rec td:first-child{position:sticky;left:0;background:var(--panel)}
.proxy{border-color:var(--warn)}
.proxy summary{cursor:pointer;font-weight:600}
.stepper{border-bottom:1px solid var(--line);padding:4px 0}
.stepper button{min-width:44px}
.plist .row{border-bottom:1px solid var(--line);padding:4px 0}
dialog::backdrop{background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ================= 定数 ================= */
const VERSION = "v0.9.8（2026/10/7版：同盟を廃止して覚醒だけに・Lv4の解放（2R14ターン目から）・フェーズの制限時間（設定で変更）・他の人の基地とキャラが見える・竜騎士王の攻撃回数を表示・奪還でキャラがいなくても終えられるよう修正・同盟・覚醒後に「建てる」が押せないことがある不具合を修正・編成後に狼煙の塔や基地が壊されても配置できるよう修正・直接つながらないときは中継サーバー経由でつなぐ・視察フェーズ以降に子の端末が止まる不具合を修正・参加し直すときに止まらないよう改善・建物の位置ボーナス（中央ほど高得点）・同じ島への侵略順は得点→マリー→抽選・キングが建物に止まるとボーナス・直前のマスに戻れない・1列目はA・B・G・Hだけ建設可・通信が止まったときの復帰・タイトル画像を背景に・得点一覧ボタン・労働は誰でも500マリー×目・天翔使いの選択制限・ターン終わりの修繕確認・売却所は建設で建て直し）";
const RES = ["ishi","taku","hane","kumo","kome","mizu"];
const RES_JA = {ishi:"石",taku:"タク",hane:"羽根",kumo:"雲",kome:"神米",mizu:"神水"};
const RES_FULL = {ishi:"不思議な石",taku:"タクミニウム",hane:"光沢の羽根",kumo:"浮遊雲",kome:"神米",mizu:"神水"};
const FAC = {
  mine:{name:"採掘製鉄所",short:"採掘",prod:["ishi","taku"]},
  lab:{name:"研究所",short:"研究",prod:["hane","kumo"]},
  shrine:{name:"神域",short:"神域",prod:["kome","mizu"]},
};
const LV_SUPPLY = {1:2,2:4,3:8,4:8};
const ROULETTE = [1,5,2,3,4,2,3,4];
const COLS = "ABCDEFGH";
const BUILD = {
  mine:{name:"採掘製鉄所（追加）",money:2000,res:{ishi:10,taku:10}},
  lab:{name:"研究所（追加）",money:2000,res:{hane:10,kumo:10}},
  shrine:{name:"神域（追加）",money:2000,res:{kome:10,mizu:10}},
  base:{name:"空賊基地 Lv1",money:1500,res:{ishi:7,taku:7}},
  warehouse:{name:"資材倉庫",money:1500,res:{hane:5,kumo:5}},
};
const BASE_UP = {2:{money:1500,res:{ishi:8,taku:8}},3:{money:2000,res:{ishi:12,taku:12,kumo:10}}};
const LANDMARKS = [
  {id:"izumi",name:"黄金の泉",eff:"毎ターンの支給金額 +1,000マリー",money:4000,res:{ishi:15,taku:15},cond:"なし",ok:p=>true},
  {id:"noroshi",name:"狼煙の塔",eff:"1回の侵略に出せるキャラ 6体→7体",money:3000,res:{ishi:10,taku:10,kumo:10},cond:"空賊基地Lv2以上を1つ",ok:p=>baseMaxLv(p)>=2},
  {id:"toudai",name:"不眠の灯台",eff:"休息が不要になる",money:1500,res:{hane:20,kumo:15},cond:"研究所を2つ",ok:p=>countFac(p,"lab")>=2},
  {id:"jousai",name:"不落の城砦",eff:"自分の建物とランドマークの耐久 +2",money:2500,res:{ishi:18,taku:18},cond:"資材倉庫を1つ",ok:p=>countKind(p,"warehouse")>=1},
  {id:"kinko",name:"強欲の金庫",eff:"略奪品が3倍",money:3000,res:{hane:15,kome:15},cond:"空賊基地Lv2以上を1つ",ok:p=>baseMaxLv(p)>=2},
  {id:"saidan",name:"再生の祭壇",eff:"修繕が1ターン後に完了・費用半額",money:3000,res:{kome:15,mizu:15},cond:"なし",ok:p=>true},
];
const LM = Object.fromEntries(LANDMARKS.map(l=>[l.id,l]));
const CHARS = {
  tenshou:{name:"天翔使い",lv:1,time:0,res:{hane:3,mizu:3},eff:"選んだマスと隣の計2マスを自分の領土に（侵略時は3体まで）"},
  kuzoku:{name:"空賊",lv:2,time:0,res:{kumo:5,kome:5},eff:"自分の領土のマスに旗を1本立てる"},
  ryukishi:{name:"竜騎士",lv:3,time:1,res:{taku:7,hane:10,kumo:10,kome:10,mizu:10},eff:"攻撃範囲5マスに単発"},
  ryuou:{name:"竜騎士王",lv:4,time:3,res:{ishi:5,kome:10,mizu:10},eff:"初期は竜騎士と同じ。生成中に強化して育てる（空賊基地Lv4が必要。覚醒した人は11ターン目から、それ以外は2ラウンド目の14ターン目から）"},
};
const STRENGTH = {
  houkou:{name:"咆哮（竜騎士王の強化）",res:{ishi:7,taku:7},eff:"攻撃回数+1（3回まで）"},
  shinsou:{name:"伸槍（竜騎士王の強化）",res:{hane:7,kumo:7},eff:"攻撃範囲+3マス（3回まで）"},
  kamui:{name:"神威（竜騎士王の強化）",res:{kome:10,mizu:10},eff:"攻撃した範囲が自分の領土に（1回のみ）"},
};
const REPAIR = {
  fac:{name:"生産施設の修繕",money:1500,res:{},eff:"2ターン後に復旧"},
  base:{name:"空賊基地の修繕",money:500,res:{ishi:10,taku:10},eff:"2ターン後に復旧"},
  landmark:{name:"ランドマークの修繕",money:1000,res:{ishi:3,taku:3,hane:3,kumo:3,kome:3,mizu:3},eff:"2ターン後に復旧"},
};
const MARKET_REBUILD = {name:"売却所の建て直し",money:1500,res:{hane:10,kumo:10},eff:"壊されたときだけ。建設アクションで、自分の領土の好きなマスに建てる（1島に1つまで）"};
const TOTAL_TURNS = 20, INSPECT_AFTER = 10;

/* ================= ユーティリティ ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n=>n.toLocaleString("ja-JP")+"マリー";
const sq = (r,c)=>`${r+1}-${COLS[c]}`;
const idx = (r,c)=>r*8+c;
const rnd = n=>Math.floor(Math.random()*n);
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clone = o=>JSON.parse(JSON.stringify(o));
const resText = r=>Object.entries(r).map(([k,v])=>RES_JA[k]+v).join("・");
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function makeCode(){const s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=s[rnd(s.length)];return c}

/* ================= ルールエンジン（純粋な状態操作） ================= */
function cells(p){return p.grid}
function countKind(p,kind){return p.grid.filter(b=>b&&b.kind===kind&&b.opened!==false&&!b.destroyed).length}
function countFac(p,fac){return p.grid.filter(b=>b&&b.kind==="fac"&&b.fac===fac&&b.opened&&!b.destroyed).length}
function baseMaxLv(p){return Math.max(0,...p.grid.filter(b=>b&&b.kind==="base"&&!b.destroyed).map(b=>b.level))}
function facLevel(b,turn){const d=turn-b.openedTurn;const base=d>=5?3:d>=2?2:1;return b.ally?Math.min(4,base+1):base}
function cap(p){return 20+10*countKind(p,"warehouse")}
function landmarkBuilt(p){return p.grid.find(b=>b&&b.kind==="landmark")}
function moneySupply(p,turn){
  let m=500;
  const lm=landmarkBuilt(p);
  if(lm&&!lm.destroyed&&lm.lm==="izumi"&&lm.builtTurn<turn)m+=1000;
  m+=300*p.grid.filter(b=>b&&b.kind==="base"&&b.level>=4&&!b.destroyed).length;
  return m;
}
/* 労働の基準額：誰でも500マリー（黄金の泉の+1,000、空賊基地Lv4の+300は含めない） */
function laborBase(p,turn){return 500}
function canAfford(p,cost){if(p.money<cost.money)return false;for(const[k,v]of Object.entries(cost.res||{}))if(p.res[k]<v)return false;return true}
function pay(p,cost){p.money-=cost.money;for(const[k,v]of Object.entries(cost.res||{}))p.res[k]-=v}
function lackText(p,cost){const l=[];if(p.money<cost.money)l.push("お金"+(cost.money-p.money));for(const[k,v]of Object.entries(cost.res||{}))if(p.res[k]<v)l.push(RES_JA[k]+(v-p.res[k]));return l.join("・")}
function logP(g,p,msg){p.log.unshift(`T${g.turn||0}：${msg}`);if(p.log.length>80)p.log.length=80}
function logG(g,msg){g.log.push({turn:g.turn,msg,at:Date.now()})}

/* ---------- 状態の小道具 ---------- */
function freshTs(){return {stage:"move",action:null,sold:0,soldTypes:[],buildDone:false,genBases:[],laborRoll:null,laborGain:0,plan:null,planDone:false,squad:null,target:null,squadDone:false}}
function newPlayer(id,name){
  return {id,name,token:null,connected:true,landmarkId:null,king:null,money:0,res:{},
    grid:Array(64).fill(null),owner:Array(64).fill(id),flags:Array(64).fill(null),dmg:Array(64).fill(0),hits:Array(64).fill(null),
    kingDmg:0,kingHits:{},sealedTurn:null,kingDownTurn:null,
    chars:[],charSeq:0,ts:freshTs(),undo:[],setupDone:false,inspectDone:false,log:[],
    pts:{destroyB:0,destroyL:0,kills:0},
    stats:{labor:0,build:0,invade:0,retake:0,laborMoney:0,sold:0,lost:0,chars:0,seq:"",gen:{},up:{houkou:0,shinsou:0,kamui:0},lmTurn:null,downed:0,lostB:0,repairs:0,skipped:0},boosted:false,awakened:false,allyWith:null};
}
function newGame(){return {v:5,phase:"lobby",sub:null,turn:0,round:1,rounds:1,r1:null,ally:null,players:[],log:[],createdAt:Date.now()}}
const P_OF=(g,id)=>g.players.find(q=>q.id===id);
function alive(b){return !!b&&!b.destroyed}
function hasLM(p,id){const l=landmarkBuilt(p);return !!l&&!l.destroyed&&l.lm===id}
function isLv4(b){return (b.kind==="base"&&b.level>=4)||(b.kind==="fac"&&b.lv4)}
/* 空賊基地のレベル上限：覚醒した人はLv4。覚醒していない人も「2ラウンド目の14ターン目から」Lv4にできる（Lv4の解放） */
const LV4_OPEN_TURN=14;
const LV4_OPEN_COST={money:3000,res:{ishi:20,taku:20,kumo:10,hane:10}};
function lv4Open(g){return !!g&&g.round===2&&g.turn>=LV4_OPEN_TURN}
function baseCap(p,g){return p.boosted||lv4Open(g)?4:3}
/* 同盟・覚醒後はラダーが1段ずり上がる：Lv L→L+1 のコストは、元の Lv(L-1)→L のコスト */
/* 同盟・覚醒後はラダーが1段ずり上がる（Lv2→3が同盟前のLv1→2と同じ）。万一Lv1の基地があれば通常のコスト */
function baseUpCost(p,b){if(p.boosted)return BASE_UP[b.level]||BASE_UP[b.level+1]||BASE_UP[3];return b.level>=3?LV4_OPEN_COST:BASE_UP[b.level+1]}
function refreshLv4(p,t){p.grid.forEach(b=>{if(b&&b.kind==="fac")b.lv4=!!(b.opened&&b.ally&&facLevel(b,t)>=4)})}

function formAlly(g,a,b){const A=P_OF(g,a),B=P_OF(g,b);A.allyWith=b;B.allyWith=a;applyBoost(g,A,"ally");applyBoost(g,B,"ally");

function startAllyPhase(g){

  const n=g.players.length>=5?2:1;const low=[...q].reverse().slice(0,n);

function allyCands(g,pid){

function allyAction(g,p,a){

  if(!A.applicants.includes(p.id))return "同盟フェーズです。申請できる人の選択を待っています";

    if(A.step!=="mutual")return "今は答える段階ではありません";

    if(A.step==="third"){formAlly(g,p.id,a.target);endAlly(g);return null}

/* 部屋を作った人が、止まっている人の代わりに1段階進める */
function pendingIds(g){
  if(g.phase==="setup")return g.players.filter(p=>!p.setupDone).map(p=>p.id);
  if(g.phase==="inspect")return g.players.filter(p=>!p.inspectDone).map(p=>p.id);
  if(g.phase!=="turn")return [];
  if(g.sub==="ally"){const A=g.ally;if(!A)return [];if(A.step==="mutual")return A.applicants.filter(x=>!(x in A.answers));if(A.step==="third")return [A.thirdBy];return A.applicants.filter(x=>!A.picks[x])}

  if(g.sub==="invade"){if(g.invStage==="squad")return g.players.filter(p=>p.ts.action==="invade"&&!p.ts.squadDone).map(p=>p.id);return Object.values(g.invQ||{}).filter(q=>q.length).map(q=>q[0])}

  if(g.sub==="retake")return g.players.filter(p=>p.ts.action==="retake"&&!p.ts.planDone).map(p=>p.id);
  if(g.sub==="repair")return g.players.filter(p=>p.ts.repairAsk&&!p.ts.repairDone).map(p=>p.id);

}
function proxyAct(g,pid){

  if(g.sub==="ally"){const A=g.ally;note("同盟フェーズ");if(A.step==="mutual")return allyAction(g,p,{kind:"allyAnswer",yes:false});const c=allyCands(g,pid);return allyAction(g,p,{kind:"allyPick",target:c[0]})}

    const act=p.sealedTurn===g.turn?"build":"labor";note(ACT_JA[act]+"を選択");return applyAction(g,pid,{kind:"choose",action:act})}
  if(g.sub==="invade"){
    p.money+=1000;note("侵略を取りやめ（遠征コストは返金）");
    if(g.invStage==="squad"){p.ts.skipped=true;p.ts.squadDone=true;p.ts.planDone=true;if(!g.players.some(q=>q.ts.action==="invade"&&!q.ts.squadDone))buildInvQueue(g);return null}
    p.ts.skipped=true;p.ts.planDone=true;for(const q of Object.values(g.invQ))if(q[0]===pid)q.shift();
    if(Object.values(g.invQ).every(x=>!x.length)){returnHome(g);goBuild(g)}return null;
  }
  if(g.sub==="build"){note("建設を終える");return applyAction(g,pid,{kind:"buildDone"})}
  if(g.sub==="repair"){note("修繕しないで終える");return applyAction(g,pid,{kind:"repairDone"})}

function startRound2(g){

function startSetup(g){
  const lms=shuffle(LANDMARKS.map(l=>l.id));
  g.players.forEach((p,i)=>{

    p.money=g.round===2?2500:1500;RES.forEach(r=>p.res[r]=10);

  });

function genChain(kr,kc){
  for(let tries=0;tries<300;tries++){
    const path=[[kr,kc]];let ok=true;
    for(let d=1;d<=3;d++){
      const [lr,lc]=path[path.length-1];const cand=[];
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        if(!dr&&!dc)continue;const nr=lr+dr,nc=lc+dc;
        if(!inB(nr,nc)||nr>kr)continue;
        if(Math.max(Math.abs(nr-kr),Math.abs(nc-kc))!==d)continue;
        cand.push([nr,nc]);
      }
      if(!cand.length){ok=false;break}
      path.push(cand[rnd(cand.length)]);
    }
    if(ok)return path.slice(1);
  }
  return null;
}
function placeKing(g,p,r,c){
  if(g.phase!=="setup")return "今はキングを置けません";
  if(p.setupDone)return "もう置いています";
  if(r<6)return "キングは7列目か8列目に置いてください";
  const chain=genChain(r,c);if(!chain)return "その場所には置けません";
  p.king={r,c};
  const types=shuffle(["mine","lab","shrine"]);
  chain.forEach(([cr,cc],i)=>{p.grid[idx(cr,cc)]={kind:"fac",fac:types[i],opened:false,openedTurn:null,initial:true}});
  p.grid[idx(2,c)]={kind:"market",opened:false,openedTurn:null,initial:true};
  p.setupDone=true;
  logP(g,p,`キングを${sq(r,c)}に配置。生産施設：${chain.map(([a,b],i)=>FAC[types[i]].name+"("+sq(a,b)+")").join("→")}／売却所：${sq(2,c)}`);

function bases(p){return p.grid.map((b,i)=>b&&b.kind==="base"?{b,i}:null).filter(Boolean)}
const LV_START={1:0,2:2,3:5};

      b.destroyed=false;delete b.repairUntil;p.dmg[i]=0;p.hits[i]=null;
      const retook=p.owner[i]!==p.id||p.flags[i];p.owner[i]=p.id;p.flags[i]=null;
      if(b.kind==="fac"&&b.opened){const nl=Math.max(1,(b.lvAtDestroy||1)-1);b.openedTurn=t-LV_START[b.ally?Math.max(1,nl-1):Math.min(3,nl)];delete b.lvAtDestroy}

    if(u.type==="ryuou"){const k=p.chars.find(c=>c.id===u.id&&c.type==="ryuou");if(!k||(!fixed&&!charUsable(p,k,g.turn)))return "その竜騎士王は出撃できません";if(kings.has(u.id))return "同じ竜騎士王は1回しか置けません";kings.add(u.id)}

  if(mode==="invade"&&!plan.dryRun){const tg=P_OF(g,plan.target);
    if(tg)for(const u of units.filter(u=>u.type==="tenshou"))for(const [r,c] of [[u.r,u.c],[u.r2,u.c2]])if(tenshouBlocked(g,tg,idx(r,c)))return `天翔使いは、建物やキングがいるマス（${sq(r,c)}）を選べません`}
  const have=usableByBase(p,g.turn);const nb={};
  for(const u of units)if(u.type!=="ryuou"){if(!u.base)return "どの空賊基地のキャラか選んでください";const k=u.base+"|"+u.type;nb[k]=(nb[k]||0)+1}

  if(mode==="invade"){

    if(isAlly(g,p.id,tg.id))return "同盟国の島は侵略できません";
  }

/* テスト用：同じブラウザ内のタブ間通信（?transport=bc） */
function bcTransport(){
  class BCConn{constructor(ch,self,other){this.ch=ch;this.self=self;this.peer=other;this.h={};this.open=true}
    on(e,f){(this.h[e]=this.h[e]||[]).push(f)} emit(e,x){(this.h[e]||[]).forEach(f=>f(x))}
    send(d){if(new TextEncoder().encode(JSON.stringify(d)).length>16384){console.warn("BC: 16KBを超えたので届かない（実機の再現）");return}this.ch.postMessage({to:this.peer,from:this.self,d})}}
  class BCPeer{constructor(id){this.id=id||("g"+Math.random().toString(36).slice(2,8));this.h={};this.conns={};
      this.ch=new BroadcastChannel("ukishima-test");
      this.ch.onmessage=e=>{const m=e.data;if(m.to!==this.id)return;
        if(m.hello){const c=new BCConn(this.ch,this.id,m.from);this.conns[m.from]=c;this.emit("connection",c);setTimeout(()=>{c.emit("open");this.ch.postMessage({to:m.from,from:this.id,ack:true})},10);return}
        if(m.ack){const c=this.conns[m.from];c&&c.emit("open");return}
        const c=this.conns[m.from];c&&c.emit("data",m.d)};
      setTimeout(()=>this.emit("open",this.id),10)}
    on(e,f){(this.h[e]=this.h[e]||[]).push(f)} emit(e,x){(this.h[e]||[]).forEach(f=>f(x))}
    connect(id){const c=new BCConn(this.ch,this.id,id);this.conns[id]=c;this.ch.postMessage({to:id,from:this.id,hello:true});return c}}
  return BCPeer;
}

/* ================= 中継通信（MQTT over WebSocket） =================
   端末どうしが直接つながらない回線の組み合わせのときに、公開の中継サーバーを経由して通信する。
   部屋を作った人は常に中継でも待ち受け、子は直接つながらなければ中継に切り替える。 */
const _qs=new URLSearchParams(location.search);
const RELAY_URLS=_qs.get("broker")?[_qs.get("broker")]:["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const NO_P2P=_qs.get("nop2p")==="1";
class MiniMQTT{
  constructor(url){this.url=url;this.h={};this.buf=new Uint8Array(0);this.pid=1;this.ok=false}
  on(e,f){this.h[e]=f}
  _emit(e,x){this.h[e]&&this.h[e](x)}
  static u8(s){return new TextEncoder().encode(s)}
  static str(s){const b=MiniMQTT.u8(s);const o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
  static len(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n)d|=128;o.push(d)}while(n);return o}
  static pkt(type,parts){const body=parts.reduce((a,p)=>a+p.length,0);const head=[type,...MiniMQTT.len(body)];const o=new Uint8Array(head.length+body);o.set(head,0);let i=head.length;for(const p of parts){o.set(p,i);i+=p.length}return o}
  connect(){return new Promise((res,rej)=>{
    let ws;try{ws=new WebSocket(this.url,"mqtt")}catch(e){return rej(e)}
    ws.binaryType="arraybuffer";this.ws=ws;
    const tm=setTimeout(()=>{try{ws.close()}catch(e){}rej(new Error("timeout"))},8000);
    ws.onopen=()=>{const id="sp"+Math.random().toString(36).slice(2,12);
      ws.send(MiniMQTT.pkt(0x10,[MiniMQTT.str("MQTT"),new Uint8Array([4,2,0,60]),MiniMQTT.str(id)]))};
    ws.onmessage=ev=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(this.buf.length+d.length);nb.set(this.buf);nb.set(d,this.buf.length);this.buf=nb;
      while(this.buf.length>=2){let i=1,mul=1,rl=0,done=false;
        while(i<this.buf.length){const c=this.buf[i++];rl+=(c&127)*mul;mul*=128;if(!(c&128)){done=true;break}}
        if(!done||i+rl>this.buf.length)break;
        const t=this.buf[0]>>4,body=this.buf.slice(i,i+rl);this.buf=this.buf.slice(i+rl);
        if(t===2){clearTimeout(tm);if(body[1]===0){this.ok=true;this.ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(e){}},30000);res(this)}else rej(new Error("refused"))}
        else if(t===3){const tl=(body[0]<<8)|body[1];const topic=new TextDecoder().decode(body.slice(2,2+tl));const p=2+tl;
          this._emit("message",{topic,text:new TextDecoder().decode(body.slice(p))})}
      }};
    ws.onerror=()=>{clearTimeout(tm);if(!this.ok)rej(new Error("ws error"))};
    ws.onclose=()=>{clearTimeout(tm);clearInterval(this.ping);const was=this.ok;this.ok=false;if(was)this._emit("close");else rej(new Error("closed"))};
  })}
  subscribe(topic){const id=this.pid++;this.ws.send(MiniMQTT.pkt(0x82,[new Uint8Array([id>>8,id&255]),MiniMQTT.str(topic),new Uint8Array([0])]))}
  publish(topic,text){if(!this.ok)return false;this.ws.send(MiniMQTT.pkt(0x30,[MiniMQTT.str(topic),MiniMQTT.u8(text)]));return true}
  close(){try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}}
}
const relayTopic=(code,who)=>"skypirates/v1/"+code+"/"+who;
/* 中継のつながり：PeerJSのつながりと同じ形（send / on("open"|"data"|"close") / open）にそろえる */
class RelayConn{
  constructor(cli,topicOut){this.cli=cli;this.out=topicOut;this.h={};this.open=false;this.relay=true}
  on(e,f){(this.h[e]=this.h[e]||[]).push(f)}
  emit(e,x){(this.h[e]||[]).forEach(f=>f(x))}
  send(d){if(!this.cli.publish(this.out,JSON.stringify({k:"d",d})))throw new Error("中継が切れています")}
  close(){this.open=false;this.closed=true}
}
/* 部屋を作った人：中継サーバーで待ち受ける（つながらなくても、直接通信はそのまま使える） */
async function hostRelayListen(){
  S.relayConns=S.relayConns||{};
  for(const url of RELAY_URLS){
    try{
      const cli=new MiniMQTT(url);await cli.connect();
      cli.subscribe(relayTopic(S.code,"host"));
      cli.on("message",({text})=>{let m;try{m=JSON.parse(text)}catch(e){return}
        if(!m||!m.f)return;const key=url+"|"+m.f;
        if(m.k==="hello"){let c=S.relayConns[key];
          if(!c||c.closed){c=S.relayConns[key]=new RelayConn(cli,relayTopic(S.code,"g-"+m.f));
            c.on("data",x=>{const msg=joinPart(c,x);if(msg)hostOnData(c,msg)});c.open=true}
          cli.publish(relayTopic(S.code,"g-"+m.f),JSON.stringify({k:"ack"}));return}
        if(m.k==="d"){const c=S.relayConns[key];if(c)c.emit("data",m.d)}
      });
      cli.on("close",()=>{setTimeout(()=>{if(S.mode==="host")hostRelayListen()},5000)});
      (S.relayClis=S.relayClis||[]).push(cli);
    }catch(e){console.warn("中継サーバーに接続できません",url,e)}
  }
}

  c.close=()=>{c.closed=true;clearInterval(hi);cli.close()};

/* 大きいメッセージは分割して送る（端末によっては1通16KBを超えると届かず、視察フェーズ以降に止まる原因になっていた） */
const PART_CHARS=4000; // 日本語でも1通あたり約12KB以内
function sendMsg(conn,obj){
  if(!conn||conn.open===false)return false;
  const s=JSON.stringify(obj);
  if(s.length<=PART_CHARS){conn.send(obj);return true}
  const id=(S.msgSeq=(S.msgSeq||0)+1);const n=Math.ceil(s.length/PART_CHARS);
  for(let i=0;i<n;i++)conn.send({t:"part",id,i,n,d:s.slice(i*PART_CHARS,(i+1)*PART_CHARS)});
  return true;
}
/* 分割されたメッセージを組み立てる。組み立て終わったら元のメッセージを返す（途中ならnull） */
function joinPart(conn,msg){
  if(msg.t!=="part")return msg;
  const box=conn.__parts||(conn.__parts={});
  const b=box[msg.id]||(box[msg.id]={n:msg.n,got:0,d:[]});
  if(b.d[msg.i]==null){b.d[msg.i]=msg.d;b.got++}
  if(b.got<b.n)return null;
  delete box[msg.id];for(const k of Object.keys(box))if(+k<msg.id)delete box[k];
  try{return JSON.parse(b.d.join(""))}catch(e){console.error(e);return null}
}

}

async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible"&&!S.wake)S.wake=await navigator.wakeLock.request("screen"),S.wake.addEventListener("release",()=>{S.wake=null})}catch(e){}}
function hostOnData(conn,msg){
  const g=S.game;
  if(msg.t==="hb")return;
  if(msg.t==="sync"){let pid=null;for(const [k,c] of S.conns)if(c===conn)pid=k;if(pid)try{sendMsg(conn,{t:"state",view:viewFor(g,pid),code:S.code})}catch(e){}return}
  if(msg.t==="join"){
    let p=msg.token&&g.players.find(q=>q.token===msg.token);
    if(!p){
      if(g.phase!=="lobby"){conn.send({t:"err",msg:"ゲームはもう始まっています（前に参加した端末からなら再参加できます）"});return}
      if(g.players.length>=6){conn.send({t:"err",msg:"満員です（最大6人）"});return}
      p=newPlayer("P"+(g.players.length+1),String(msg.name||"プレイヤー").slice(0,12));p.token=msg.token;g.players.push(p);
      toast(`${p.name}さんが参加しました`);

    conn.send({t:"welcome",pid:p.id,code:S.code});

  }
  if(msg.t==="act"){

    broadcast();
  }
}

async function guestJoin(code,name,tries){

  const relayUrl=RELAY_URLS[(prefRelay||NO_P2P?tries-1:tries-2)%RELAY_URLS.length];
  S.via=useRelay?"relay":"p2p";
  S.joinStage=useRelay?"relay":"lib";const t0=Date.now();
  const maxTries=useRelay&&tries===1?2:3;
  const retry=()=>{clearInterval(S.joinTimer);if(S.view)return;if(tries<maxTries+(prefRelay?0:0))guestJoin(S.code,name,tries+1);else joinFail(S.joinStage)};
  joinMsg(S.joinStage,tries,0);
  S.joinTimer=setInterval(()=>{if(S.view){clearInterval(S.joinTimer);return}const sec=Math.round((Date.now()-t0)/1000);
    if(sec>=(useRelay?20:15))retry();else joinMsg(S.joinStage,tries,sec)},1000);
  const onData=(conn,m)=>{
    S.lastMsg=Date.now();if(S.stale){S.stale=false;render()}
    const msg=joinPart(conn,m);if(!msg)return;
    if(msg.t==="hb")return;
    if(msg.t==="welcome"){S.seat=msg.pid;try{localStorage.setItem("ukishima_last_guest",JSON.stringify({code:S.code,name}));localStorage.setItem("ukishima_relay_"+S.code,conn.relay?"1":"0")}catch(e){}}
    else if(msg.t==="state"){S.view=msg.view;clearInterval(S.joinTimer);render()}
    else if(msg.t==="err"){toast(msg.msg);if(!S.view){clearInterval(S.joinTimer);renderMsg(msg.msg,true)}}
  };
  const wire=conn=>{
    S.hostConn=conn;
    conn.on("data",m=>onData(conn,m));
    conn.on("close",()=>{if(conn!==S.hostConn)return;if(!S.view)return;toast("接続が切れました。つなぎ直しています");S.reconnect&&S.reconnect()});
  };
  const sendJoin=conn=>{if(!S.view)S.joinStage="join";conn.send({t:"join",name,token:getToken(S.code,name)})};
  let connect;
  if(useRelay){
    connect=async()=>{try{const c=await guestRelayConnect(relayUrl);if(S.via!=="relay")return c.close();wire(c);sendJoin(c)}catch(e){if(!S.view)retry()}};
  }else{
    let peer;try{peer=await makePeer()}catch(e){clearInterval(S.joinTimer);return guestJoin(S.code,name,tries+1)}
    if(S.view)return;
    S.peer=peer;S.joinStage="server";
    connect=()=>{
      const conn=peer.connect(peerId(S.code),{reliable:true,serialization:"json"});
      S.joinStage=S.view?S.joinStage:"host";wire(conn);
      conn.on("open",()=>sendJoin(conn));
    };
    peer.on("open",connect);
    peer.on("error",e=>{if(!S.view)return retry();toast("通信エラー："+(e.type||e.message))});
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  }
  if(useRelay)connect();
  S.reconnect=()=>{
    if(S.via==="relay"){const old=S.hostConn;S.hostConn=null;try{old&&old.close()}catch(e){}connect();return}
    const peer=S.peer;if(!peer||peer.destroyed){guestJoin(S.code,name,1);return}
    S.lost=false;const old=S.hostConn;S.hostConn=null;try{old&&old.close&&old.close()}catch(e){}try{if(peer.disconnected)peer.reconnect()}catch(e){}connect()};
  // 親からの合図が15秒届かなければ「止まっている」と表示し、自動で再接続を試す
  S.lastMsg=Date.now();
  S.watch=setInterval(()=>{if(!S.view||S.lost)return;const gap=Date.now()-S.lastMsg;
    if(gap>15000&&!S.stale){S.stale=true;render()}
    if(gap>20000&&Date.now()-(S.lastTry||0)>20000){S.lastTry=Date.now();S.reconnect()}
    if(gap>60000&&Date.now()-(S.lastFull||0)>60000){S.lastFull=Date.now();guestJoin(S.code,name,S.via==="relay"?2:1)}
  },5000);
}
if(!window.__visHook){window.__visHook=1;document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.mode==="guest"&&S.view&&Date.now()-(S.lastMsg||0)>8000&&S.reconnect)S.reconnect()})}
/* ================= フェーズの制限時間 =================
   部屋を作った人が「⚙ 設定」でフェーズごとにオン・オフと秒数（5〜300秒）を決める。
   時間切れになると、そのフェーズで待っている人を「代わりに進める」と同じ形で自動で進める。 */
const TIMER_PHASES=[
  ["setup","キングの配置（ゲーム開始時）","8列目のどこかに自動で置く"],
  ["prep","支給〜アクション選択（キング移動・キャラ生成・アクション）","キングを自動で動かし、労働を選ぶ"],
  ["inspect","視察","視察を終える"],
  ["squad","侵略：編成","侵略を取りやめる（遠征コストは返金）"],
  ["place","侵略：配置（1人ずつ）","侵略を取りやめる（遠征コストは返金）"],
  ["build","建設","建設を終える"],
  ["retake","奪還","奪還せずに終える"],
  ["repair","ターンの終わり（修繕の確認）","修繕しない"]];
function defaultTimers(){return Object.fromEntries(TIMER_PHASES.map(([k])=>[k,{on:false,sec:60}]))}
function timerKey(g){
  if(g.phase==="setup")return "setup";
  if(g.phase==="inspect")return "inspect";
  if(g.phase!=="turn")return null;
  if(g.sub==="invade")return g.invStage==="squad"?"squad":"place";
  return g.sub;
}
function timerSig(g){const k=timerKey(g);if(!k)return null;return k+"|"+g.round+"|"+g.turn+(k==="place"?"|"+JSON.stringify(g.invQ):"")}
function timerInfo(g){
  const k=timerKey(g);const st=(g.timers||{})[k];
  if(!k||!st||!st.on||!g.timerStart||g.timerSig!==timerSig(g))return null;
  return {key:k,left:Math.max(0,Math.ceil((g.timerStart+st.sec*1000-Date.now())/1000)),sec:st.sec};
}
/* 部屋を作った人（と1台モード）の画面で1秒ごとに確認する */
function timerTick(){
  const g=S.game;if(!g||(S.mode!=="host"&&S.mode!=="local"))return;
  g.timers=g.timers||defaultTimers();
  const sig=timerSig(g);
  if(sig!==g.timerSig){g.timerSig=sig;g.timerStart=Date.now();if(sig&&(g.timers[timerKey(g)]||{}).on)broadcast();return}
  const ti=timerInfo(g);if(!ti||ti.left>0)return;
  const ids=pendingIds(g);if(!ids.length)return;
  for(const id of ids){const err=safeApply(g,id,null,()=>proxyAct(g,id));
    if(!err){const p=P_OF(g,id);logP(g,p,`制限時間（${ti.sec}秒）になったので自動で進めました`)}}
  g.timerSig=null;broadcast();
}
setInterval(timerTick,1000);
/* 残り時間の表示（画面全体を描き直さずに数字だけ更新） */
setInterval(()=>{const el=document.getElementById("timerbadge");if(!el||!S.timerEnd)return;
  const left=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000));el.textContent=`⏱ 残り${left}秒`;el.classList.toggle("warn",left<=10)},500);
function openSettings(){
  const d=$("#dlg");const can=S.mode!=="guest";
  const T=(S.mode==="guest"?(S.view.timers||defaultTimers()):(S.game.timers=S.game.timers||defaultTimers()));
  d.innerHTML=`<b>⚙ 設定：フェーズの制限時間</b>
  <div class="sub">オンにしたフェーズは、決めた秒数（5〜300秒）を過ぎると、待っている人を自動で進めます。${can?"":"<br>設定を変えられるのは部屋を作った人だけです。"}</div>
  <table class="result-t" style="margin-top:8px"><tr><th>フェーズ</th><th>制限</th><th class="n">秒数</th></tr>
  ${TIMER_PHASES.map(([k,name,what])=>`<tr><td>${esc(name)}<br><small class="sub">時間切れ：${esc(what)}</small></td>
    <td><label><input type="checkbox" data-ton="${k}" ${T[k]&&T[k].on?"checked":""} ${can?"":"disabled"}> オン</label></td>
    <td class="n"><input type="number" min="5" max="300" step="5" data-tsec="${k}" value="${T[k]?T[k].sec:60}" style="width:72px" ${can?"":"disabled"}></td></tr>`).join("")}</table>
  <div class="row" style="margin-top:8px">${can?`<button class="primary" id="tsave">保存</button><button id="tall">全部オン</button><button id="tnone">全部オフ</button>`:""}<button id="dclose">閉じる</button></div>`;
  d.showModal();$("#dclose").onclick=()=>d.close();

  const read=()=>{const o={};for(const [k] of TIMER_PHASES){const on=d.querySelector(`[data-ton="${k}"]`).checked;let sec=Math.round(+d.querySelector(`[data-tsec="${k}"]`).value||60);sec=Math.min(300,Math.max(5,sec));o[k]={on,sec}}return o};
  $("#tsave").onclick=()=>{S.game.timers=read();S.game.timerSig=null;d.close();toast("制限時間の設定を保存しました");broadcast()};
  $("#tall").onclick=()=>d.querySelectorAll("[data-ton]").forEach(c=>c.checked=true);

}

  let h=`<div class="board"><div></div>${[...COLS].map(c=>`<div class="lab">${c}</div>`).join("")}`;
  for(let r=0;r<8;r++){
    h+=`<div class="lab">${r+1}</div>`;
    for(let c=0;c<8;c++){
      const i=idx(r,c),b=p.grid[i];const own=p.owner?p.owner[i]:p.id;
      const isK=p.king&&p.king.r===r&&p.king.c===c;
      const cls=["cell"];if(targets.has(i)||(opt.setup&&r>=6))cls.push("target");if(range.has(i))cls.push("inrange");
      const st=own&&own!==p.id?`style="background:color-mix(in srgb,${pcol(own)} 38%,var(--cell))"`:"";
      const fl=p.flags&&p.flags[i]?`<span class="fl" style="background:${pcol(p.flags[i])}">🚩</span>`:"";

      h+=`<button class="${cls.join(" ")}" ${st} ${opt.readonly?'tabindex="-1" data-ro="1"':""} data-r="${r}" data-c="${c}" aria-label="${sq(r,c)}">${b?bLabel(b,turn):""}${rb}${kd}${fl}${dm}${mk}</button>`;
    }

  return h+`</div><div class="sub" style="text-align:center">${opt.caption||"上が1列目（前）／下が8列目（後ろ）"}</div>`;

  const order=steps.map(s=>s[0]);const ci=order.indexOf(cur);
  const subJa={prep:"",invade:"：侵略フェーズ",build:"：建設フェーズ",retake:"：奪還フェーズ",repair:"：ターンの終わり（修繕の確認）"}[v.sub]||"";

  d.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const [r,c]=b.dataset.up.split(",").map(Number);d.close();doAct({kind:"upgrade",r,c})});
  $("#dclose").onclick=()=>d.close();
}
function repairCost(me,b){const base=REPAIR[b.kind==="fac"?"fac":b.kind];const altar=me.hasAltar&&!(b.kind==="landmark"&&b.lm==="saidan");
  return {altar,dur:altar?1:2,cost:altar?{money:Math.ceil(base.money/2),res:Object.fromEntries(Object.entries(base.res).map(([k,v])=>[k,Math.ceil(v/2)]))}:base}}
function repairAskHTML(v){
  const me=v.me;const t=v.turn;
  if(!me.ts.repairAsk||me.ts.repairDone)return `<div class="panel"><b>ターンの終わり：修繕の確認</b><div class="sub">建物を壊された人（残り${v.waiting}人）が、修繕するかどうかを選んでいます。</div><div class="row" style="margin-top:8px"><button id="bsell">💰 売却</button></div></div>`;
  const ruins=me.grid.map((b,i)=>b&&b.destroyed&&b.destroyedTurn===t?{b,i}:null).filter(Boolean);
  const rows=ruins.map(({b,i})=>{const {altar,dur,cost}=repairCost(me,b);const late=t+dur>TOTAL_TURNS;const ok=!b.repairUntil&&!late&&canAfford(me,cost);
    return `<div class="row" style="margin-top:6px"><span class="grow">${esc(bName(b))}（${sq(Math.floor(i/8),i%8)}）<br><small class="sub">${b.repairUntil?`修繕中（${b.repairUntil}ターン目に完了）`:`${yen(cost.money)}${Object.keys(cost.res).length?"＋"+resText(cost.res):""}・${dur}ターン後に完了${altar?"（祭壇）":""}${late?"・もう間に合いません":""}${!late&&!canAfford(me,cost)?"・足りない："+esc(lackText(me,cost)):""}`}</small></span>
      ${b.repairUntil?`<span class="pill ok">修繕する</span>`:`<button class="${ok?"primary":""}" data-rep="${i}" ${ok?"":"disabled"}>🔧 修繕する</button>`}</div>`}).join("");
  return `<div class="panel"><b>ターンの終わり：壊された建物を修繕しますか？</b>
    <div class="sub">このターンに壊された建物です。修繕するものは「修繕する」を押し、終わったら「これで終える」。ここで修繕しなくても、後のターンでいつでも修繕できます（19・20ターン目を除く）。お金や資材が足りなければ、先に売却もできます。</div>
    ${rows}
    <div class="row" style="margin-top:10px"><button id="bsell">💰 売却</button>${me.undoCount?`<button id="bundo">↩ 取り消す</button>`:""}<button class="primary grow" id="brepdone">これで終える</button></div></div>`;
}
function openRepair(){
  const me=S.view.me;const d=$("#dlg");const t=S.view.turn;
  const list=destroyedList(me).map(({b,i})=>{const {altar,dur,cost}=repairCost(me,b);const late=t+dur>TOTAL_TURNS;const ok=!b.repairUntil&&!late&&canAfford(me,cost);
    return `<button class="${ok?"can":""}" data-rep="${i}" ${ok?"":"disabled"}><span>${esc(bName(b))}（${sq(Math.floor(i/8),i%8)}）</span><span class="c">${b.repairUntil?`修繕中（${b.repairUntil}ターン目に完了）`:`${yen(cost.money)}${Object.keys(cost.res).length?"＋"+resText(cost.res):""}・${dur}ターン後${altar?"（祭壇）":""}${late?"<br>もう間に合いません":""}${!canAfford(me,cost)?"<br>足りない："+esc(lackText(me,cost)):""}`}</span></button>`}).join("");
  d.innerHTML=`<b>修繕</b><div class="sub">アクションは使いません。完了するとレベルが1段下がり、そのマスの領土が戻って敵の旗も消えます。</div><div class="menu">${list||"<div class='sub'>壊された建物はありません</div>"}</div><div class="row" style="margin-top:8px"><button id="dclose">閉じる</button></div>`;
  d.showModal();
  d.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{d.close();doAct({kind:"repair",i:+b.dataset.rep})});
  $("#dclose").onclick=()=>d.close();
}
function openSell(){
  const me=S.view.me;const d=$("#dlg");
  const m=me.grid.find(b=>b&&b.kind==="market");
  const avail=m&&m.opened&&m.openedTurn<S.view.turn;
  d.innerHTML=`<b>資材を売る</b><div class="sub">1個50マリー／1ターン${me.ts.sellCap||10}個まで・${me.ts.sellTypes||2}種類まで${me.ts.sellCap?"（キングが売却所に止まったので増えています）":""}（今ターン：${me.ts.sold}個${me.ts.soldTypes.length?"・"+me.ts.soldTypes.map(r=>RES_JA[r]).join("、"):""}）</div>
  ${avail?`<div class="row" style="margin-top:8px"><select id="sres">${RES.map(r=>`<option value="${r}">${RES_FULL[r]}（${me.res[r]}個）</option>`).join("")}</select>
  <input id="sn" type="number" min="1" max="${me.ts.sellCap||10}" value="${Math.max(1,Math.min((me.ts.sellCap||10)-me.ts.sold,5))}" style="width:80px"><button class="primary" id="sgo">売る</button></div>`
  :`<div class="hint">${m&&m.opened?"売却所は開放した1ターン後から使えます。":"売却所がまだ開放されていません。キングを売却所のマスに止めると開放されます。"}</div>`}
  <div class="row" style="margin-top:8px"><button id="dclose">閉じる</button></div>`;
  d.showModal();
  if($("#sgo"))$("#sgo").onclick=()=>{doAct({kind:"sell",res:$("#sres").value,n:+$("#sn").value});d.close()};
  $("#dclose").onclick=()=>d.close();
}
/* 全プレイヤーの現在の得点（各ラウンドの視察フェーズから見られる。10ターン目までは見られない） */
function openScores(){
  const v=S.view;const d=$("#dlg");
  if(!v.scores){toast("得点は、各ラウンドの視察フェーズ（10ターン目の後）から見られます");return}
  const r2=v.round===2&&v.r1;
  const rows=v.scores.map(s=>({...s,sum:(r2&&v.r1[s.id]?v.r1[s.id].total:0)+s.total})).sort((a,b)=>(r2?b.sum-a.sum:b.total-a.total));
  d.innerHTML=`<b>現在の得点（${v.round}ラウンド目・${v.phase==="inspect"?"視察フェーズ":v.turn+"ターン目"}）</b>
  <div class="sub">今の盤面で計算した得点です（ゲーム終了時の得点とは変わります）。</div>
  <div style="overflow-x:auto"><table class="result-t"><tr><th>順位</th><th>名前</th>${r2?"<th>合計</th><th>1R</th>":""}<th>${r2?"2R":"得点"}</th><th>領土</th><th>旗</th><th>建設物</th><th>破壊・瀕死</th><th>所持金</th><th>覚醒</th></tr>
  ${rows.map((r,i)=>`<tr${r.id===(v.me&&v.me.id)?' style="font-weight:bold"':""}><td>${i+1}</td><td>${esc(r.name)}</td>${r2?`<td class="n"><b>${r.sum}</b></td><td class="n">${v.r1[r.id]?v.r1[r.id].total:"-"}</td>`:""}<td class="n"><b>${r.total}</b></td><td class="n">${r.territory}</td><td class="n">${r.flagPts}</td><td class="n">${r.buildings}</td><td class="n">${r.destroy}</td><td class="n">${r.money}</td><td class="n">${r.ally||0}</td></tr>`).join("")}</table></div>
  <div class="row" style="margin-top:8px"><button id="dclose">閉じる</button></div>`;
  d.showModal();$("#dclose").onclick=()=>d.close();
}
/* コスト表（施設／キャラ）。今のお金と資材で作れるものをハイライト */
function openCost(tab){
  const me=S.view&&S.view.me;const d=$("#dlg");
  const have=!!(me&&me.res&&Object.keys(me.res).length);
  const row=(name,cost,note,okExtra=true,sub="")=>{
    const ok=have&&canAfford(me,cost)&&okExtra;
    const lack=have&&!canAfford(me,cost)?`足りない：${lackText(me,cost)}`:"";
    return `<div class="cost ${ok?"can":""}"><div class="row"><b class="grow">${esc(name)}</b>${ok?`<span class="pill ok">作れる</span>`:""}</div>
      <div>${cost.money?yen(cost.money):"お金不要"}${Object.keys(cost.res||{}).length?"＋"+resText(cost.res):""}</div>
      ${note?`<div class="sub">${esc(note)}</div>`:""}${sub?`<div class="sub">${sub}</div>`:""}${lack?`<div class="sub">${esc(lack)}</div>`:""}</div>`;
  };
  let body="";
  if(tab==="fac"){
    body+=`<div class="sub" style="margin:6px 0">建設</div>`;
    for(const k of ["mine","lab","shrine"])body+=row(FAC[k].name+"（追加建設）",BUILD[k],`${FAC[k].prod.map(r=>RES_JA[r]).join("・")}を作る／2点／耐久3回`);
    body+=row("空賊基地 Lv1",BUILD.base,"天翔使いが作れる／2点／耐久3回");
    body+=row("空賊基地 Lv1→Lv2",BASE_UP[2],"空賊が作れる");
    body+=row("空賊基地 Lv2→Lv3",BASE_UP[3],"竜騎士が作れる");
    body+=row(`空賊基地 Lv3→Lv4（覚醒していない人・2ラウンド目の${LV4_OPEN_TURN}ターン目から）`,LV4_OPEN_COST,"竜騎士王が作れる／毎ターン+300マリー／耐久5回",!!(me&&!me.boosted&&me.baseCap>=4));
    body+=row("空賊基地 Lv3→Lv4（覚醒した人）",BASE_UP[3],"竜騎士王が作れる／毎ターン+300マリー／耐久5回。覚醒後はレベルアップのコストが1段ずり上がる（Lv2→3は石8・タク8、Lv3→4は石12・タク12・雲10）",!!(me&&me.boosted));
    body+=row("資材倉庫",BUILD.warehouse,"資材の上限 +10個／2点／耐久3回");
    body+=row(MARKET_REBUILD.name+"（建設）",MARKET_REBUILD,MARKET_REBUILD.eff,!!(me&&me.marketLost&&!me.grid.some(b=>b&&b.kind==="market")));
    body+=`<div class="hint">建物の得点には、建てたマスの位置ボーナスが上乗せされます：外側0点／1つ内側+1点／2つ内側+2点／中央4マス+3点（盤面の「+数字」）。ランドマーク・資材倉庫・売却所も対象。旗は対象外</div>`;
    body+=`<div class="sub" style="margin:10px 0 6px">ランドマーク（5点・耐久5回・自分の島は抽選で決まった1種類だけ）</div>`;
    for(const l of LANDMARKS){
      const mine=me&&me.landmarkId===l.id;
      const condOk=mine&&l.ok(me);
      body+=row(l.name+(mine?"（あなたの島）":""),{money:l.money,res:l.res},`${l.eff}／条件：${l.cond}`,mine&&condOk&&!me.grid.some(b=>b&&b.kind==="landmark"),mine?(condOk?"":"条件をまだ満たしていません"):"このラウンドは建てられません");
    }
    body+=`<div class="sub" style="margin:10px 0 6px">修繕（どのフェーズでも・アクション不要。建物が壊されたターンは、その最後に修繕するか確認されます）</div>`;
    for(const k of Object.keys(REPAIR))body+=row(REPAIR[k].name,REPAIR[k],REPAIR[k].eff);
  }else{
    const maxLv=me&&me.grid?Math.max(0,...me.grid.filter(b=>b&&b.kind==="base").map(b=>b.level)):0;
    body+=`<div class="sub" style="margin:6px 0">キャラ生成（お金は不要・基地1つにつき1ターン1体）</div>`;
    for(const [k,c] of Object.entries(CHARS)){
      const lvOk=maxLv>=c.lv;
      body+=row(c.name,{money:0,res:c.res},`${c.eff}／空賊基地Lv${c.lv}以上／${c.time?c.time+"ターン後に完成":"即時"}`,lvOk,lvOk?"":`空賊基地Lv${c.lv}が必要です`);
    }
    body+=`<div class="sub" style="margin:10px 0 6px">竜騎士王の強化（生成中の3回だけ・1ターン1回）</div>`;
    for(const [k,s] of Object.entries(STRENGTH))body+=row(s.name,{money:0,res:s.res},s.eff,maxLv>=4,maxLv>=4?"":"竜騎士王の生成中のみ");
  }
  d.innerHTML=`<div class="row"><b class="grow">コスト表</b><button id="dclose">閉じる</button></div>
  <div class="tabs" style="margin-top:8px"><button data-ct="fac" class="${tab==="fac"?"on primary":""}">🏗 施設</button><button data-ct="char" class="${tab==="char"?"on primary":""}">🗡 キャラ</button></div>
  ${tab?`<div class="sub">${have?`緑色が、今のお金（${yen(me.money)}）と資材で作れるものです。`:""}</div><div class="costlist">${body}</div>`:`<div class="hint">見たいほうを選んでください。</div>`}`;
  if(!d.open)d.showModal();
  d.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>openCost(b.dataset.ct));
  $("#dclose").onclick=()=>d.close();
}
function exportLog(){
  const blob=new Blob([JSON.stringify(S.game,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`skypirates_${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function bind(){
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  document.querySelectorAll("[data-seat]").forEach(b=>b.onclick=()=>{S.seat=b.dataset.seat;S.ui={mode:null,build:null,tab:"me"};S.view=viewFor(S.game,S.seat);render()});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.ui.tab=b.dataset.tab;render()});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>doAct({kind:"choose",action:b.dataset.act}));
  document.querySelectorAll("[data-gen]").forEach(b=>b.onclick=()=>{const [i,ch]=b.dataset.gen.split("|");doAct({kind:"gen",i:+i,char:ch})});
  on("brecon",()=>S.reconnect&&S.reconnect());
  on("bcopy",()=>{navigator.clipboard?.writeText($("#shareurl").value);toast("コピーしました")});
  on("bstart",()=>{startSetup(S.game);broadcast()});
  on("bcost",()=>openCost(null));
  on("bscore",()=>openScores());
  on("bset",()=>openSettings());
  on("bstay",()=>doAct({kind:"stay"}));
  on("bgennext",()=>doAct({kind:"genNext"}));
  on("bundecide",()=>doAct({kind:"undecide"}));
  on("bbuildm",()=>openBuildMenu());
  on("bbdone",()=>{S.ui.mode=null;doAct({kind:"buildDone"})});
  on("bsell",()=>openSell());
  on("bundo",()=>doAct({kind:"undo"}));
  on("bcancel",()=>{S.ui.mode=null;render()});
  on("binsp",()=>doAct({kind:"inspectDone"}));
  on("bexport",exportLog);
  document.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{S.ui.plan={target:b.dataset.target,units:[],pick:null,first:null};render()});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const P=S.ui.plan;P.pick=b.dataset.pick;P.first=null;render()});
  document.querySelectorAll("[data-unrm]").forEach(b=>b.onclick=()=>{S.ui.plan.units.splice(+b.dataset.unrm,1);render()});
  document.querySelectorAll("[data-sqt]").forEach(b=>b.onclick=()=>{S.ui.squad.target=b.dataset.sqt;render()});
  document.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>{const p=b.dataset.sq.split("|");const k=p[0]+"|"+p[1];const Q=S.ui.squad;Q.sel[k]=Math.max(0,(Q.sel[k]||0)+(+p[2]));if(!Q.sel[k])delete Q.sel[k];render()});
  document.querySelectorAll("[data-sqb]").forEach(b=>b.onclick=()=>{S.ui.squad.base=b.dataset.sqb;render()});
  document.querySelectorAll("[data-binfo]").forEach(b=>b.onclick=()=>openBaseInfo(b.dataset.binfo));
  on("bsquad",()=>{const Q=S.ui.squad;doAct({kind:"squad",target:Q.target,squad:{sel:Q.sel,kings:Q.kings}})});
  document.querySelectorAll("[data-sqk]").forEach(b=>b.onclick=()=>{const Q=S.ui.squad;const id=+b.dataset.sqk;Q.kings=Q.kings.includes(id)?Q.kings.filter(x=>x!==id):[...Q.kings,id];render()});
  document.querySelectorAll("[data-str]").forEach(b=>b.onclick=()=>{const [i,up]=b.dataset.str.split("|");doAct({kind:"strengthen",i:+i,up})});
  document.querySelectorAll("[data-allyyes]").forEach(b=>b.onclick=()=>doAct({kind:"allyAnswer",yes:b.dataset.allyyes==="1"}));
  document.querySelectorAll("[data-allypick]").forEach(b=>b.onclick=()=>doAct({kind:"allyPick",target:b.dataset.allypick}));
  document.querySelectorAll("[data-rounds]").forEach(b=>b.onclick=()=>{S.game.rounds=+b.dataset.rounds;broadcast()});
  on("bnext",()=>doAct({kind:"nextRound"}));
  document.querySelectorAll("[data-proxy]").forEach(b=>b.onclick=()=>{const id=b.dataset.proxy;if(!confirm(`${pname(id)}の代わりに進めますか？`))return;const err=safeApply(S.game,id,null,()=>proxyAct(S.game,id));if(err)toast(err);broadcast()});
  on("bcsv",downloadCSV);
  on("bunsquad",()=>doAct({kind:"unsquad"}));
  on("brepdone",()=>doAct({kind:"repairDone"}));
  if(S.view&&S.view.sub==="repair")document.querySelectorAll(".panel [data-rep]").forEach(b=>b.onclick=()=>doAct({kind:"repair",i:+b.dataset.rep}));
  on("bplanclr",()=>{S.ui.plan.units=[];S.ui.plan.first=null;render()});
  on("bplanskip",()=>{if(S.ui.plan.units.length&&!confirm("配置したキャラは出さずに、奪還を終えますか？"))return;doAct({kind:"plan",plan:{units:[]}})});
  on("bplan",()=>{const P=S.ui.plan;doAct({kind:"plan",plan:{target:P.target,units:P.units}})});
  on("bunplan",()=>doAct({kind:"unplan"}));
  on("brepair",()=>openRepair());
  document.querySelectorAll(".cell:not([data-ro])").forEach(el=>el.onclick=()=>{
    const r=+el.dataset.r,c=+el.dataset.c;const v=S.view;
    if(v.phase==="setup"){doAct({kind:"placeKing",r,c});return}
    if(v.phase!=="turn")return;
    const me=v.me;
    if((v.sub==="invade"||v.sub==="retake")&&me.ts.action===v.sub&&!me.ts.planDone){planTap(r,c);return}
    if(v.sub==="prep"&&me.ts.stage==="move"){doAct({kind:"move",r,c});return}
    if(S.ui.mode==="build"){const w=S.ui.build;S.ui.mode=null;doAct({kind:"build",what:w,r,c});return}
    const b=me.grid[idx(r,c)];
    if(b&&b.destroyed&&b.kind!=="market"){openRepair();return}
    if(b&&b.kind==="base"&&b.level<me.baseCap&&v.sub==="build"&&me.ts.action==="build"&&!me.ts.buildDone)openBuildMenu();
  });
}
/* 起動 */
render();
if(new URLSearchParams(location.search).get("room")){setTimeout(()=>{const n=$("#jname");if(n&&!n.value)n.focus()},0)}
window.__S=S; // テスト用
</script>
